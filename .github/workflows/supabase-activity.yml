name: GFC Supabase activity

on:
  schedule:
    - cron: '17 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query-players:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query one public player row
        env:
          SUPABASE_URL: https://pdbbawisgdqgioirueyn.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_eU2QSAbU2pshBfNNcHjRfg_MEk2uITq
        run: |
          curl --fail-with-body --silent --show-error --retry 2 \
            --connect-timeout 10 --max-time 30 \
            --get "$SUPABASE_URL/rest/v1/players" \
            --data-urlencode 'select=id' \
            --data-urlencode 'limit=1' \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -o /dev/null
